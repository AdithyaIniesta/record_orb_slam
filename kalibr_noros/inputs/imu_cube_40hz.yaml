# Kalibr IMU noise model: Cube Orange+ IMU0 over MAVLink at 40 Hz (what RigCapture requested before the 100 Hz fix, e.g. stereo_0013).
# Same continuous-time values as imu_cube_100hz.yaml (inflated starting values, see the comments there); only update_rate differs.
rostopic: /imu0
update_rate: 40.0

accelerometer_noise_density: 1.0e-02   # [m/s^2/sqrt(Hz)]
accelerometer_random_walk:   2.0e-04   # [m/s^3/sqrt(Hz)]
gyroscope_noise_density:     1.0e-03   # [rad/s/sqrt(Hz)]
gyroscope_random_walk:       1.0e-05   # [rad/s^2/sqrt(Hz)]
